name: CI

on:
  push:
    branches: [main, Development]
  pull_request:
    branches: [main, Development]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: sitrep
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_password
      DB_NAME: sitrep
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      JWT_EXPIRES_IN: 1d
      RECAPTCHA_SECRET_KEY: ci-dummy-recaptcha-key
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci-dummy-groq-key' }}
      GROQ_MODEL: openai/gpt-oss-120b
      FRONTEND_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # bcrypt has native bindings that must be compiled at install time.
      - name: Install native build tools for bcrypt
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Seed database
        run: npm run seed

      - name: Test
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_BASE_URL: http://localhost:3000
      VITE_RECAPTCHA_SITE_KEY: ci-dummy-recaptcha-site-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
